# /etc/sysctl.d/90-one-armed-cake.conf
# router-shaper also sets forwarding and the per-interface redirect switch on
# every start; these make the settings hold from boot.
net.ipv4.ip_forward=1
# Without this the box tells clients "the ISP router is on your subnet, go
# direct", and their traffic bypasses the shaper.
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
