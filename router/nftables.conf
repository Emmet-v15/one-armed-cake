#!/usr/sbin/nft -f
flush ruleset

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "eth0" ip saddr 192.168.1.0/24 ip daddr != 192.168.1.0/24 masquerade
    }
}

# Traffic priority. Runs in FORWARD: inbound NAT is already reversed and
# outbound masquerade has not happened yet, so the real LAN host is visible
# in BOTH directions here.
table ip mangle {
    chain forward {
        type filter hook forward priority mangle; policy accept;
        # contents are owned by router-shaper (FAIRNESS=fair|priority)
    }

    # The monitor's own latency probe. Marking it EF puts it in CAKE's Voice tin,
    # so the dashboard reports the latency a properly marked realtime app (game,
    # VoIP) actually gets -- not what unmarked bulk traffic sees.
    chain output {
        type filter hook output priority mangle; policy accept;
        ip daddr 1.1.1.1 tcp dport 443 counter ip dscp set ef
        udp dport 5201 counter ip dscp set ef   # dashboard UDP echo probe to the reflector
    }
}

# Per-device byte accounting, keyed by LAN IP.
table ip accounting {
    set up   { type ipv4_addr; size 512; flags dynamic; counter; }
    set down { type ipv4_addr; size 512; flags dynamic; counter; }

    chain forward {
        type filter hook forward priority filter; policy accept;
        ip saddr 192.168.1.0/24 update @up   { ip saddr }
        ip daddr 192.168.1.0/24 update @down { ip daddr }
    }
}
